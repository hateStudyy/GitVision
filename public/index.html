<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitVision · A Field Guide to Open Source</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="lang-switch" id="lang-switch">
        <button class="lang-btn active" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">English</button>
      </div>
      <div class="header-text">
        <h1 data-i18n-html="site.title">Git<em>Vision</em></h1>
        <p class="subtitle" data-i18n="site.subtitle">每个仓库都有一个故事 —— 从第一次提交开始</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 输入区 -->
    <section class="input-card">
      <div class="input-row">
        <input
          id="repo-input"
          type="text"
          data-i18n-attr="placeholder:input.placeholder"
          placeholder="粘贴 GitHub 仓库地址，或输入 owner/repo"
          autocomplete="off"
        />
        <button id="analyze-btn" data-i18n="input.analyze">开始阅读</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <!-- 推荐仓库 -->
    <section id="recommendations" class="recommendations">
      <div class="rec-tabs">
        <button class="rec-tab active" data-tab="classics" data-i18n="rec.tab.classics">编辑精选</button>
        <button class="rec-tab" data-tab="top-stars" data-i18n="rec.tab.top">Stars 榜</button>
        <button class="rec-tab" data-tab="trending" data-i18n="rec.tab.trending">本周新作</button>
      </div>
      <div class="rec-panels">
        <div class="rec-panel active" id="panel-classics">
          <p class="rec-source" data-i18n="rec.source.classics">塑造现代软件世界的十部经典</p>
          <div id="classics" class="rec-list"></div>
        </div>
        <div class="rec-panel" id="panel-top-stars">
          <p class="rec-source"><span data-i18n="rec.source.label">数据来源：</span><a href="https://github.com/EvanLi/Github-Ranking" target="_blank" rel="noopener">Github-Ranking</a> · <span data-i18n="rec.source.daily">每日更新</span></p>
          <div id="top-stars" class="rec-list"><span class="rec-loading" data-i18n="common.loading">加载中…</span></div>
        </div>
        <div class="rec-panel" id="panel-trending">
          <p class="rec-source" data-i18n="rec.source.trending">最近七日内崭露头角的新项目</p>
          <div id="trending" class="rec-list"><span class="rec-loading" data-i18n="common.loading">加载中…</span></div>
        </div>
      </div>
    </section>

    <!-- 结果区 -->
    <section id="result" class="result hidden">

      <div class="panel" data-chapter="I">
        <h2 data-i18n="panel.basic">仓库概况</h2>
        <div id="basic-info" class="basic-info"></div>
      </div>

      <div class="panel" data-chapter="II">
        <h2 data-i18n="panel.overview">叙事简介</h2>
        <div id="overview" class="overview"></div>
      </div>

      <div class="panel highlight" data-chapter="III">
        <h2 data-i18n="panel.quickLinks">直达入口</h2>
        <p class="panel-desc" data-i18n="panel.quickLinks.desc">直奔最早的提交、Releases、贡献者图谱 —— 所有链接永久有效</p>
        <div id="quick-links" class="quick-links"></div>
        <h3 data-i18n="panel.yearJumps">按年份浏览</h3>
        <div id="year-jumps" class="year-jumps"></div>
      </div>

      <div class="panel" data-chapter="IV">
        <h2 data-i18n="panel.firstCommit">起点</h2>
        <div id="first-commit" class="first-commit"></div>
      </div>

      <div class="panel" data-chapter="V">
        <h2 data-i18n="panel.starHistory">Star 增长曲线</h2>
        <p class="panel-desc" data-i18n="panel.starHistory.desc">由 star-history.com 提供，点击查看完整交互视图</p>
        <div id="star-history" class="star-history"></div>
      </div>

      <div class="panel" data-chapter="VI">
        <h2 data-i18n="panel.timeline">完整时间线</h2>
        <div id="timeline" class="timeline"></div>
      </div>

      <div class="panel" data-chapter="VII">
        <h2 data-i18n="panel.milestones">关键里程碑</h2>
        <div id="milestones" class="milestones"></div>
      </div>

      <div class="panel" data-chapter="VIII">
        <h2 data-i18n="panel.categorized">提交分类</h2>
        <div id="categorized" class="categorized"></div>
      </div>

      <div class="panel" data-chapter="IX">
        <h2 data-i18n="panel.commits">最新与最早</h2>
        <div class="two-col">
          <div>
            <h3 data-i18n="panel.commits.latest">最新二十条</h3>
            <ul id="latest-commits" class="commit-list"></ul>
          </div>
          <div>
            <h3 data-i18n="panel.commits.earliest">最早二十条</h3>
            <ul id="earliest-commits" class="commit-list"></ul>
          </div>
        </div>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="https://github.com/hateStudyy/GitVision" target="_blank" rel="noopener">hateStudyy / GitVision</a>
    </div>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
